; PANOPTICON -- macOS export preset, for CI.
;
; Same deal as export_presets.windows.cfg: not export_presets.cfg, copied into
; place immediately before exporting, never committed. See that file's header
; for why.
;
; Universal binary (x86_64 + arm64), ad-hoc code signing (required for arm64
; to run at all on Apple Silicon), no notarisation. Friends launching an
; unsigned/ad-hoc-signed app still hit Gatekeeper on first run -- see
; docs/BUILDING.md.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/macos/Panopticon.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.neotechnites.panopticon"
; Built-in (ad-hoc only): uses the system's own /usr/bin/codesign, no Xcode
; or rcodesign required. Needed for the arm64 slice to run at all.
codesign/codesign=1
codesign/entitlements/app_sandbox/enabled=false
notarization/notarization=0
ssh_remote_deploy/enabled=false
; Universal binary needs both: S3TC/BPTC for the x86_64 slice, ETC2/ASTC for arm64.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
