; PANOPTICON -- Windows Desktop export preset, for CI.
;
; This file is NOT export_presets.cfg. The workflow copies it to the project
; root under that name immediately before exporting and the copy is never
; committed, for two reasons:
;
;   1. export_presets.cfg is the Godot editor's file. It rewrites it whenever
;      anybody opens the export dialog, and it accumulates local absolute paths
;      and per-machine signing settings. A committed one is a merge conflict
;      waiting to happen and a way to leak a local path into the repo.
;   2. Keeping it here means the export configuration lives with the rest of the
;      CI tooling and is reviewed with it.
;
; If you want to export by hand from the editor, open the export dialog and set
; up a Windows Desktop preset there; the editor's own export_presets.cfg is
; gitignored and will not disturb this one.
;
; Only options that must not take their default are set. Everything absent is
; filled in by the Windows exporter's own defaults, which is deliberate: a
; preset that restates every default is a preset that goes stale silently on the
; next engine release.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The test suite and its tooling are development-only and have no business in a
; shipped build. They are excluded here rather than moved, because they must
; stay importable in the project the tests run against.
exclude_filter="tests/*, tools/*"
export_path="build/windows/panopticon.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
; Keep the .pck alongside the .exe rather than embedded. Two files is what
; Steam's depot upload expects, and an embedded pck makes the exe opaque to a
; hash-based patcher.
binary_format/embed_pck=false
; Off, and this one matters for CI. Writing the icon and version strings into
; the .exe needs rcedit, which needs Wine on a Linux runner; leaving it off
; means the export needs nothing but the engine and the templates. Turn it on
; only alongside a step that installs both.
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/file_version=""
application/product_version=""
application/company_name="Neotechnites"
application/product_name="Panopticon"
application/file_description="PANOPTICON"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
; No separate console executable. The game ships as one window.
debug/export_console_wrapper=0
; The project renders with GL Compatibility, so the desktop GL driver is the
; one that matters and the ANGLE/D3D12 shims above stay off.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
ssh_remote_deploy/enabled=false
